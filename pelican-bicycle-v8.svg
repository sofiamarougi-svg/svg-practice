    <polygon points="190,205 230,180 262,205 240,240 195,245" fill="#e0e0e0"/>
    <polygon points="190,205 210,185 240,182 215,212" fill="#f5f5f5"/>
    <polygon points="215,212 240,182 262,205 240,240" fill="#bdbdbd"/>
    <polygon points="195,245 240,240 265,258 210,262" fill="#9e9e9e"/>
