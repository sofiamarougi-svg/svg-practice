  <circle cx="286" cy="146" r="3.5" fill="#263238"/>

  <circle cx="268" cy="292" r="16" fill="none" stroke="#78909c" stroke-width="3"/>
  <circle cx="268" cy="292" r="4" fill="#546e7a"/>

