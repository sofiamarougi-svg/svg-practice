  <rect x="200" y="186" width="36" height="12" rx="5" fill="#4527a0"/>
  <path d="M316 196 L317 178 L360 178" fill="none" stroke="#4527a0" stroke-width="7" stroke-linecap="round"/>

  <!-- low-poly pelican -->
