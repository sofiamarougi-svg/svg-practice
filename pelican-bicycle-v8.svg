    <polygon points="245,190 255,160 268,192 262,205" fill="#f5f5f5"/>
    <polygon points="255,160 276,145 283,162 262,192" fill="#e0e0e0"/>
    <!-- head -->
    <polygon points="272,138 296,134 300,152 276,158" fill="#fafafa"/>
    <!-- bill -->
    <polygon points="298,140 340,146 296,156" fill="#ffb300"/>
    <polygon points="300,156 332,158 298,160" fill="#ff8f00"/>
    <!-- pouch -->
