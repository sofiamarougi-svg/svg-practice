<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="360" fill="#eceff1"/>
  <g>
    <polygon points="0,300 120,270 240,300 480,280 480,360 0,360" fill="#90a4ae"/>
    <polygon points="0,300 120,270 200,312 0,340" fill="#78909c"/>
    <polygon points="240,300 360,285 480,280 480,360 300,360" fill="#78909c"/>
  </g>

  <!-- stylized wheels as polygons -->
