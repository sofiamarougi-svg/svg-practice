<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="350" fill="#b3e5fc"/>
  <rect y="270" width="500" height="80" fill="#81c784"/>
  <rect y="270" width="500" height="10" fill="#66bb6a"/>
  <rect y="300" width="500" height="50" fill="#616161"/>

  <!-- moving road dashes (period 44, loops seamlessly) -->
  <g stroke="#ffeb3b" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0; -44 0" dur="0.5s" repeatCount="indefinite"/>
    <line x1="-50" y1="325" x2="550" y2="325" stroke-dasharray="26 18"/>
  </g>

  <!-- drifting cloud -->
  <g fill="#ffffff" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0; -30 0; 0 0" dur="6s" repeatCount="indefinite"/>
    <ellipse cx="120" cy="60" rx="36" ry="15"/>
    <ellipse cx="146" cy="55" rx="26" ry="12"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0; -40 0; 0 0" dur="9s" repeatCount="indefinite"/>
    <ellipse cx="380" cy="45" rx="40" ry="16"/>
    <ellipse cx="408" cy="40" rx="28" ry="12"/>
  </g>

  <ellipse cx="265" cy="330" rx="155" ry="9" fill="#000000" opacity="0.25"/>

  <!-- rear wheel -->
  <circle cx="150" cy="280" r="46" fill="none" stroke="#263238" stroke-width="8"/>
  <g stroke="#b0bec5" stroke-width="1.6">
    <animateTransform attributeName="transform" type="rotate" from="0 150 280" to="360 150 280" dur="1.1s" repeatCount="indefinite"/>
    <line x1="150" y1="240" x2="150" y2="320"/>
    <line x1="110" y1="280" x2="190" y2="280"/>
    <line x1="121.7" y1="251.7" x2="178.3" y2="308.3"/>
    <line x1="178.3" y1="251.7" x2="121.7" y2="308.3"/>
  </g>
  <circle cx="150" cy="280" r="8" fill="#78909c"/>
  <circle cx="150" cy="280" r="3" fill="#263238"/>

  <!-- front wheel -->
  <circle cx="380" cy="280" r="46" fill="none" stroke="#263238" stroke-width="8"/>
  <g stroke="#b0bec5" stroke-width="1.6">
    <animateTransform attributeName="transform" type="rotate" from="0 380 280" to="360 380 280" dur="1.1s" repeatCount="indefinite"/>
    <line x1="380" y1="240" x2="380" y2="320"/>
    <line x1="340" y1="280" x2="420" y2="280"/>
    <line x1="351.7" y1="251.7" x2="408.3" y2="308.3"/>
    <line x1="408.3" y1="251.7" x2="351.7" y2="308.3"/>
  </g>
  <circle cx="380" cy="280" r="8" fill="#78909c"/>
  <circle cx="380" cy="280" r="3" fill="#263238"/>

  <!-- frame -->
  <g fill="none" stroke="#00897b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 280 L210 195 L350 200"/>
    <path d="M210 195 L265 285 L150 280"/>
    <path d="M265 285 L350 200 L380 280"/>
    <path d="M350 200 L346 178"/>
  </g>
  <rect x="188" y="183" width="44" height="13" rx="6" fill="#4e342e"/>
  <path d="M322 172 Q350 164 376 174" fill="none" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>

  <!-- chainring + chain -->
  <circle cx="265" cy="285" r="20" fill="none" stroke="#90a4ae" stroke-width="3.5"/>
  <circle cx="265" cy="285" r="5" fill="#455a64"/>
  <g stroke="#78909c" stroke-width="2.5" fill="none">
    <path d="M265 266 L150 270"/>
    <path d="M265 304 L150 290"/>
  </g>

  <!-- rotating cranks + pedaling feet -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 265 285" to="360 265 285" dur="1.1s" repeatCount="indefinite"/>
    <line x1="265" y1="285" x2="265" y2="267" stroke="#546e7a" stroke-width="5" stroke-linecap="round"/>
    <line x1="265" y1="285" x2="265" y2="303" stroke="#546e7a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="265" cy="265" rx="10" ry="5" fill="#f5924f"/>
    <ellipse cx="265" cy="305" rx="10" ry="5" fill="#f5924f"/>
  </g>

  <!-- pelican (bobs while riding) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="0.55s" repeatCount="indefinite"/>
    <path d="M165 215 Q130 208 118 228 Q144 224 168 229" fill="#cfd5dc"/>
    <path d="M232 220 L258 278" stroke="#f5924f" stroke-width="9" stroke-linecap="round"/>
    <path d="M244 222 L272 278" stroke="#e67e22" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="212" cy="205" rx="52" ry="35" fill="#fafbfc" stroke="#dfe3e8" stroke-width="2"/>
    <path d="M252 188 Q270 166 262 146 Q256 130 244 122" fill="none" stroke="#fafbfc" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="242" cy="116" rx="20" ry="18" fill="#ffffff"/>
    <path d="M250 128 Q286 120 316 132 Q294 142 250 138 Z" fill="#f9a825" stroke="#e65100" stroke-width="2" stroke-linejoin="round"/>
    <path d="M254 138 Q278 158 308 144 Q292 166 256 144 Z" fill="#ffcc80" stroke="#f4a460" stroke-width="1.5"/>
    <circle cx="248" cy="113" r="4.5" fill="#263238"/>
    <circle cx="249.5" cy="111.5" r="1.5" fill="#ffffff"/>
    <path d="M218 192 Q184 182 172 208 Q186 224 218 224 Q231 204 218 192 Z" fill="#eceff1" stroke="#b0b8c1" stroke-width="2"/>
    <path d="M258 174 L344 180" stroke="#f5924f" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 0; -20 0; 0 0" dur="0.4s" repeatCount="indefinite"/>
    <path d="M30 220 H70"/>
    <path d="M20 245 H66"/>
    <path d="M36 270 H74"/>
  </g>
</svg>